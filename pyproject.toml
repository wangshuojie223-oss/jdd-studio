[project]
name = "jdd-studio"
version = "2.2.3"
description = "剧多多文生图自动化工作台：角色设计 skill 生成提示词 → 浏览器自动填词生成 → 预览选择 → 保存"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.48",
    "openai>=1.50",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "openpyxl>=3.1",
]

[tool.uv]
package = false
